[project]
name = "private-knowledge-rag"
version = "0.1.0"
description = "Private Knowledge RAG assistant (v0.1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.10",
    "redis>=5.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "pypdf>=4",
    # Agent（自主工具调用）能力。仅 agent 路径使用，且为延迟导入：
    # 未安装时 /v1/query 等既有管道不受影响（见 app/agent/runner.py）。
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # LangGraph 编排层（12 §2.2）：StateGraph + MemorySaver checkpoint；app/agent/graph.py。
    "langgraph>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # 与本地/CI 的默认规则集保持一致，避免不同 ruff 版本给出不同结论
    "ruff>=0.17,<0.19",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require live infrastructure (PostgreSQL/Qdrant)",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入惯用法：Depends()/File() 必须写在参数默认值里（B008 不适用）
"app/api/routers/*.py" = ["B008"]
