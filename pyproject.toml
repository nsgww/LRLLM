[project]
name = "private-knowledge-rag"
version = "0.1.0"
description = "Private Knowledge RAG assistant (v0.1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "qdrant-client>=1.10",
    "redis>=5.0",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "pypdf>=4",
    # Agent（自主工具调用）能力。仅 agent 路径使用，且为延迟导入：
    # 未安装时 /v1/query 等既有管道不受影响（见 app/agent/runner.py）。
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require live infrastructure (PostgreSQL/Qdrant)",
]
